
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Document | TrustVault</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f9f8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .logo {
            color: #159b8c;
            font-size: 27px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }

        h2 {
            color: #243b3b;
            margin-bottom: 10px;
        }

        .description {
            color: #829393;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            color: #344b4b;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce8e6;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #159b8c;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #159b8c;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #107d72;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #159b8c;
            text-decoration: none;
            font-size: 14px;
        }

        .messages {
            margin-bottom: 15px;
        }

        .message {
            padding: 10px;
            background: #fff1f0;
            color: #c0392b;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo">TrustVault</div>

        <h2>Share Document</h2>

        <p class="description">
            Share your document securely with another TrustVault user.
        </p>

        <p style="margin-bottom:20px;color:#159b8c;font-weight:bold;">
            Document: {{ document.title }}
        </p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Recipient Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Select Permission</label>
            <select name="permission" required>
                <option value="">Choose permission</option>
                <option value="read">Read Only</option>
                <option value="edit">Read and Edit</option>
            </select>

            <button type="submit">Share Document</button>
        </form>

        <a href="{% url 'document_list' %}" class="back">
            ← Back to My Documents
        </a>

    </div>
</body>
</html>
