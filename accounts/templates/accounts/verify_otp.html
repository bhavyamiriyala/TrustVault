
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | TrustVault</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f9f8;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
            text-align: center;
        }

        .logo {
            color: #159b8c;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h2 {
            color: #243b3b;
            margin-bottom: 12px;
        }

        .description {
            color: #829393;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce8e6;
            border-radius: 7px;
            outline: none;
            font-size: 22px;
            text-align: center;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #159b8c;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #159b8c;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #107d72;
        }

        .messages {
            margin-bottom: 15px;
        }

        .message {
            padding: 10px;
            background: #fff1f0;
            color: #c0392b;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .success {
            background: #eafaf3;
            color: #16845b;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">TrustVault</div>

        <h2>Verify Your Email</h2>

        <p class="description">
            We have sent a 6-digit verification code to your email address.
            Enter the code below to complete your registration.
            The code expires in 5 minutes.
        </p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {% if message.tags == 'success' %}success{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="otp"
                placeholder="000000"
                maxlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >

            <button type="submit">Verify OTP</button>
        </form>

    </div>

</body>
</html>
